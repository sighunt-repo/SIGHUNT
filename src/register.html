<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <h2>register</h2>
    <div id="registerResult" class="error-msg" style="color: red;"></div>

    <form id="registerForm">
      <input type="text" id="username" placeholder="username" required>
      <input type="password" id="password" placeholder="password" required>
      <button type="submit">register</button>
    </form>

    <p>account already exists? <a href="login.html"> click to login</a></p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const resultBox = document.getElementById('registerResult');

      if (!username || !password) {
        resultBox.style.color = 'red';
        resultBox.innerText = "username and password cannot be empty";
        return;
      }

      try {
        const response = await fetch("https://skyeker.top/register", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();

        if (result.success) {
          resultBox.style.color = 'green';
          resultBox.innerText = "Registration successful, redirecting...";
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1000);
        } else {
          resultBox.style.color = 'red';
          resultBox.innerText = result.message || "Registration failed";
        }
      } catch (error) {
        console.error("Registration request failed:", error);
        resultBox.style.color = 'red';
        resultBox.innerText = " Registration request failed, please try again later";
      }
    });
  </script>
</body>
</html>
